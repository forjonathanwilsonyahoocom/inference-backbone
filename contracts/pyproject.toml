[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-backbone-contracts"
version = "0.1.0"
description = "Shared data contracts for the inference backbone"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools]
packages = [
    "contracts",
    "contracts.inference_contracts",
    "contracts.general_contracts",
]

