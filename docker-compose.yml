services:
  weaviate:
    image: semitechnologies/weaviate:1.39.3-2489571.amd64
    ports:
      - "8084:8080"
      - "50051:50051"
    restart: on-failure:0
    volumes:
      - "./datasets/weaviate:/var/lib/weaviate"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"


  graphdb:
    image: khaller/graphdb-free:10.6.2
    container_name: graphdb
    restart: unless-stopped

    ports:
      - "7200:7200"          # SPARQL endpoint + UI

    environment:
      GDB_HEAP_SIZE: 2G      # adjust for your RAM

    volumes:
      - ./datasets/graphdb:/opt/graphdb/data
      - ./repository.init:/repository.init

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7200/rest/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  backbone-api:
    build: ./backbone-api
    container_name: backbone_api
    ports:
      - "8000:8000"
    environment:
      GRAPHDB_URL: http://graphdb:7200/repositories/inference-backbone
      OLLAMA_BASE_URL: http://10.42.0.192:11434
      GEN_MODEL: gpt-oss:20b
    volumes:
      - ./backbone-api:/app
      - ./contracts:/app/contracts
      - ./datasets/backbone-api:/indexed-artifacts

  worker-agent:
    build: ./worker-agent
    container_name: worker_agent
    ports:
      - "8001:8000"
    shm_size: '2gb'
    environment:
      OLLAMA_URL: http://10.42.0.192:11434
      GEN_MODEL: gpt-oss:20b 
      DISTILL_GEN_MODEL: gpt-oss:20b 
      WORKSPACE: /agentworkspace
    volumes:
      - ./worker-agent:/app
      - ./contracts:/app/contracts
      - ./observability:/app/observability
      - ./worker-agent-workspace:/agentworkspace
    restart: unless-stopped

  validator-agent:
    build: ./validator-agent
    container_name: validator_agent
    ports:
      - "8002:8000"
    environment:
      OLLAMA_URL: http://10.42.0.192:11434
      GEN_MODEL: gpt-oss:20b
    restart: unless-stopped
    volumes:d
      - ./validator-agent:/app
      - ./contracts:/app/contracts

  jupyter:
    build: ./jupyter
    ports:
      - "8080:8080"
    volumes:d
      - ./jupyter/notebooks/:/localjup/notebooks

  prometheus:
    image: docker.io/prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-6h}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:rw
    ports:
      - "3011:3000"

volumes:
  grafana-data:
  prometheus-data:

      
      
      
