[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "observability"
version = "0.1.0"
description = "Metrics and telemetry helpers"
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.22.1",
]

[tool.setuptools]
packages = [
    "observability",
]

[tool.setuptools.package-dir]
observability = "."

