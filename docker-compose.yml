services:
 
  backbone-api:
    build:
      context: .
      dockerfile: backbone-api/Dockerfile
    container_name: backbone_api
    environment:
      GRAPHDB_URL: http://graphdb:7200/repositories/inference-backbone
      OLLAMA_BASE_URL: http://10.42.0.192:11434
      GEN_MODEL: gpt-oss:20b
    volumes:
      - ./datasets/backbone-api:/indexed-artifacts
    networks:
      worker-api:
      validator-api:
      data:

  worker-agent:
    build:
      context: .
      dockerfile: worker-agent/Dockerfile
    container_name: worker_agent
    shm_size: '2gb'
    environment:
      OLLAMA_URL: http://10.42.0.192:11434
      GEN_MODEL: gpt-oss:20b 
      DISTILL_GEN_MODEL: gpt-oss:20b 
      WORKSPACE: /agentworkspace
    volumes:
      - ./worker-agent-workspace:/agentworkspace
    restart: unless-stopped
    networks:
      worker-api:
      worker-webtools:
          ipv4_address: 172.21.0.2

  web-tools:
    build:
      context: .
      dockerfile: web-tools/Dockerfile
    container_name: web_tools
    shm_size: '2gb'
    restart: unless-stopped
    networks:
      web-tool-egress:
      worker-webtools:
        ipv4_address: 172.21.0.3
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    volumes:
      - firewall-ready:/run/firewall
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        token="$(cat /proc/sys/kernel/random/uuid)"
        printf '%s' "$token" > /run/firewall/token
        until [ -f /run/firewall/ready ] &&
              [ "$(cat /run/firewall/ready)" = "$token" ]; do
          sleep 0.1
        done
        exec "$@"
      - web-tools
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  firewall-init:
    build:
      context: ./firewall-init
    network_mode: "service:web-tools"
    cap_add:
      - NET_ADMIN
    depends_on:
      web-tools:
        condition: service_started
    volumes:
      - firewall-ready:/run/firewall
      
  validator-agent:
    build:
      context: .
      dockerfile: validator-agent/Dockerfile
    container_name: validator_agent
    environment:
      OLLAMA_URL: http://10.42.0.192:11434
      GEN_MODEL: gpt-oss:20b
    restart: unless-stopped
    networks:
      - validator-api

  jupyter:
    build: ./jupyter
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./jupyter/notebooks/:/localjup/notebooks
    networks:
      - worker-api
      - validator-api

  weaviate:
    image: semitechnologies/weaviate:1.39.3-2489571.amd64
    container_name: weaviate
    restart: on-failure:0
    volumes:
      - "weaviate-data:/var/lib/weaviate"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    networks:
      - data

  graphdb:
    image: khaller/graphdb-free:10.6.2
    container_name: graphdb
    restart: unless-stopped
    environment:
      GDB_HEAP_SIZE: 2G      # adjust for your RAM
    ports:
      - "127.0.0.1:7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/data
      - ./repository.init:/repository.init
    networks:
      - data

  prometheus:
    image: docker.io/prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-6h}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - worker-api
      - validator-api

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:rw
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
    ports:
      - "127.0.0.1:3011:3000"
    networks:
      - worker-api
      - validator-api


volumes:
  grafana-data:
  prometheus-data:
  graphdb-data:
  weaviate-data:
  firewall-ready:
  
networks:
  worker-api:
    driver: bridge

  validator-api:
    driver: bridge

  data:
    driver: bridge

  web-tool-egress:
    driver: bridge
    
  worker-webtools:
    driver: bridge
    enable_ipv6: false
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/29
          gateway: 172.21.0.1

