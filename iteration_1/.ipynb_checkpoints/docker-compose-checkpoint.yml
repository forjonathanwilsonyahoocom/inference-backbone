version: '3.8'
services:
  graphdb:
    build: ./graphdb
    container_name: graphdb
    ports:
      - "7200:7200"
      - "8080:8080"
    volumes:
      - ./data:/opt/graphdb/data
  fastapi:
    build: ./fastapi
    container_name: sparql_api
    ports:
      - "8000:8000"
    depends_on:
      - graphdb
