[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-backbone-observability"
version = "0.1.0"
description = "Shared observability utilities for the inference backbone"
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.22.1",
]

[tool.setuptools]
packages = [
    "observability",
]
