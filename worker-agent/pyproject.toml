[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worker-agent"
version = "0.1.0"
# Keep runtime dependencies in requirements.txt if you prefer.
# Or list them here.

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

