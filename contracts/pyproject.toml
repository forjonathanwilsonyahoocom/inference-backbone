[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contracts"
version = "0.1.0"
description = "Shared contract definitions for the inference-backbone"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools]
packages = [
    "contracts",
    "contracts.general_contracts",
    "contracts.inference_contracts",
]

[tool.setuptools.package-dir]
contracts = "."
"contracts.general_contracts" = "general_contracts"
"contracts.inference_contracts" = "inference_contracts"

